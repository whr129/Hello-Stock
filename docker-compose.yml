services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_agent}
      POSTGRES_USER: ${POSTGRES_USER:-news_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [database]
    restart: unless-stopped

  migrate:
    build:
      context: .
    image: ${NEWS_AGENT_IMAGE:-news-agent:local}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_agent}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-news_agent}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
    networks: [database]
    restart: "no"

  bot:
    build:
      context: .
    image: ${NEWS_AGENT_IMAGE:-news-agent:local}
    command: ["news-agent"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_agent}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-news_agent}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]
    networks: [default, database]
    restart: unless-stopped

  scheduler:
    build:
      context: .
    image: ${NEWS_AGENT_IMAGE:-news-agent:local}
    command: ["news-agent-scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_agent}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-news_agent}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]
    networks: [default, database]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  database:
    internal: true
