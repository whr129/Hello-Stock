name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate source
    uses: ./.github/workflows/ci.yml
    with:
      skip-container-build: true

  publish:
    name: Publish GHCR image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy production
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Upload deployment files
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -d -m 700 "$HOME/news-agent" "$HOME/news-agent/scripts"'
          scp -i "$HOME/.ssh/deploy_key" -P "$DEPLOY_PORT" \
            docker-compose.yml scripts/backup-database.sh scripts/deploy-production.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:news-agent/"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'mv "$HOME/news-agent/backup-database.sh" "$HOME/news-agent/deploy-production.sh" "$HOME/news-agent/scripts/"'
      - name: Deploy immutable image
        shell: bash
        run: |
          printf '%s\n' "$IMAGE_REF" | \
            ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'read -r image_ref && cd "$HOME/news-agent" && NEWS_AGENT_IMAGE="$image_ref" bash scripts/deploy-production.sh'
